<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressor de Receita Amarela (A)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style id="page-style">
    @media print {
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        position: absolute;
        top: 0;
        left: 0;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      .guia-fundo {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialCoords = {
      dia: { x: 16, y: 54 },
      mes: { x: 30, y: 54 },
      ano: { x: 54, y: 54 },
      paciente: { x: 75, y: 54 },
      endereco: { x: 80, y: 64 },
      medicamento: { x: 140, y: 29 },
      quantidade: { x: 130, y: 54 },
      posologia: { x: 130, y: 74 },
    };

    function App() {
      const [modoPapel, setModoPapel] = useState('bandeja148');
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [dados, setDados] = useState({
        dia: new Date().getDate().toString().padStart(2, '0'),
        mes: (new Date().getMonth() + 1).toString().padStart(2, '0'),
        ano: new Date().getFullYear().toString().slice(-2),
        paciente: '',
        endereco: '',
        medicamento: '',
        quantidade: '',
        posologia: ''
      });

      const [coords, setCoords] = useState(initialCoords);
      const [mostrarGuia, setMostrarGuia] = useState(true);

      useEffect(() => {
        const styleElement = document.getElementById('page-style');
        let pageSize = '190mm 148mm';
        if (modoPapel === 'a4') pageSize = 'A4 portrait';
        if (modoPapel === 'exato') pageSize = '190mm 97mm';

        styleElement.innerHTML = `
          @media print {
            @page {
              size: ${pageSize};
              margin: 0;
            }
            body {
              margin: 0;
              padding: 0;
              background: transparent !important;
            }
            .no-print {
              display: none !important;
            }
            .print-area {
              position: absolute;
              top: 0;
              left: 0;
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            .guia-fundo {
              display: none !important;
            }
          }
        `;
      }, [modoPapel]);

      const handleChange = (campo, valor) => {
        setDados(prev => ({ ...prev, [campo]: valor }));
      };

      const handleCoordChange = (campo, eixo, valor) => {
        setCoords(prev => ({
          ...prev,
          [campo]: { ...prev[campo], [eixo]: Number(valor) }
        }));
      };

      return (
        <div className="p-4 md:p-6 max-w-7xl mx-auto">
          {/* Topo de Controles */}
          <div className="no-print bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Impressor Notificação A</h1>
              <p className="text-sm text-slate-500">Compatível com impressoras com bandeja mínima de 148 mm</p>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <label className="flex items-center gap-2 text-sm text-slate-600 select-none cursor-pointer">
                <input 
                  type="checkbox" 
                  checked={mostrarGuia} 
                  onChange={(e) => setMostrarGuia(e.target.checked)}
                  className="rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                />
                Simular Gabarito
              </label>
              <button 
                onClick={() => window.print()}
                className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition-all cursor-pointer"
              >
                Imprimir
              </button>
            </div>
          </div>

          <div className="flex flex-col lg:flex-row gap-6">
            <div className="no-print w-full lg:w-5/12 space-y-4">
              {/* Configuração de Impressora e Bandeja */}
              <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl space-y-3">
                <h3 className="font-semibold text-amber-900 text-sm">Ajustes da Bandeja da Impressora</h3>
                
                <div>
                  <label className="text-xs font-semibold text-amber-900 uppercase">Tamanho Configurado no Driver:</label>
                  <select 
                    value={modoPapel} 
                    onChange={(e) => setModoPapel(e.target.value)}
                    className="w-full mt-1 border border-amber-300 rounded p-2 text-sm bg-white"
                  >
                    <option value="bandeja148">Bandeja Mínima (190 × 148 mm)</option>
                    <option value="a4">Folha de Apoio A4 (Receita presa no A4)</option>
                    <option value="exato">Papel Exato (190 × 97 mm)</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs font-semibold text-amber-900 uppercase">Deslocamento Global (Se a bandeja centralizar):</label>
                  <div className="grid grid-cols-2 gap-2 mt-1">
                    <label className="flex items-center gap-1 text-xs bg-white border border-amber-200 p-1.5 rounded">
                      Offset X (mm):
                      <input 
                        type="number" 
                        value={offset.x} 
                        onChange={(e) => setOffset(prev => ({ ...prev, x: Number(e.target.value) }))}
                        className="w-16 border rounded px-1 ml-auto"
                      />
                    </label>
                    <label className="flex items-center gap-1 text-xs bg-white border border-amber-200 p-1.5 rounded">
                      Offset Y (mm):
                      <input 
                        type="number" 
                        value={offset.y} 
                        onChange={(e) => setOffset(prev => ({ ...prev, y: Number(e.target.value) }))}
                        className="w-16 border rounded px-1 ml-auto"
                      />
                    </label>
                  </div>
                </div>
              </div>

              {/* Formulário dos Dados */}
              <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 className="text-base font-semibold text-slate-800">Dados da Prescrição</h2>
                
                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Data</label>
                  <div className="grid grid-cols-3 gap-2 mt-1">
                    <input 
                      type="text" 
                      placeholder="Dia" 
                      value={dados.dia} 
                      onChange={(e) => handleChange('dia', e.target.value)} 
                      className="border border-slate-300 rounded p-2 text-sm"
                    />
                    <input 
                      type="text" 
                      placeholder="Mês" 
                      value={dados.mes} 
                      onChange={(e) => handleChange('mes', e.target.value)} 
                      className="border border-slate-300 rounded p-2 text-sm"
                    />
                    <input 
                      type="text" 
                      placeholder="Ano" 
                      value={dados.ano} 
                      onChange={(e) => handleChange('ano', e.target.value)} 
                      className="border border-slate-300 rounded p-2 text-sm"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Paciente</label>
                  <input 
                    type="text" 
                    value={dados.paciente} 
                    onChange={(e) => handleChange('paciente', e.target.value)} 
                    placeholder="Nome Completo"
                    className="w-full mt-1 border border-slate-300 rounded p-2 text-sm"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Endereço</label>
                  <input 
                    type="text" 
                    value={dados.endereco} 
                    onChange={(e) => handleChange('endereco', e.target.value)} 
                    placeholder="Rua, número, bairro, cidade"
                    className="w-full mt-1 border border-slate-300 rounded p-2 text-sm"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Medicamento</label>
                  <input 
                    type="text" 
                    value={dados.medicamento} 
                    onChange={(e) => handleChange('medicamento', e.target.value)} 
                    placeholder="Nome e Concentração"
                    className="w-full mt-1 border border-slate-300 rounded p-2 text-sm"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Quantidade e Apresentação</label>
                  <input 
                    type="text" 
                    value={dados.quantidade} 
                    onChange={(e) => handleChange('quantidade', e.target.value)} 
                    placeholder="Ex: 30 comprimidos"
                    className="w-full mt-1 border border-slate-300 rounded p-2 text-sm"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 uppercase">Posologia</label>
                  <textarea 
                    rows="2"
                    value={dados.posologia} 
                    onChange={(e) => handleChange('posologia', e.target.value)} 
                    placeholder="Instruções de uso..."
                    className="w-full mt-1 border border-slate-300 rounded p-2 text-sm resize-none"
                  ></textarea>
                </div>
              </div>

              {/* Calibragem individual */}
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <details className="group">
                  <summary className="font-semibold text-sm cursor-pointer list-none flex justify-between items-center text-slate-700">
                    <span>Calibragem Individual de Cada Campo (mm)</span>
                    <span className="text-xs text-blue-600 group-open:rotate-180 transition-transform">▼</span>
                  </summary>
                  <div className="mt-4 space-y-3 pt-3 border-t border-slate-100 text-xs">
                    {Object.keys(coords).map((campo) => (
                      <div key={campo} className="flex items-center justify-between gap-2">
                        <span className="capitalize font-medium w-28 text-slate-600">{campo}</span>
                        <div className="flex gap-2">
                          <label className="flex items-center gap-1">
                            X: <input 
                              type="number" 
                              value={coords[campo].x} 
                              onChange={(e) => handleCoordChange(campo, 'x', e.target.value)}
                              className="w-14 border border-slate-300 rounded px-1.5 py-0.5"
                            />
                          </label>
                          <label className="flex items-center gap-1">
                            Y: <input 
                              type="number" 
                              value={coords[campo].y} 
                              onChange={(e) => handleCoordChange(campo, 'y', e.target.value)}
                              className="w-14 border border-slate-300 rounded px-1.5 py-0.5"
                            />
                          </label>
                        </div>
                      </div>
                    ))}
                    <button 
                      onClick={() => setCoords(initialCoords)}
                      className="mt-3 text-xs text-red-600 hover:underline block"
                    >
                      Restaurar valores padrão
                    </button>
                  </div>
                </details>
              </div>
            </div>

            {/* Prévia da Área de Impressão */}
            <div className="w-full lg:w-7/12 flex flex-col items-center overflow-x-auto pb-8">
              <div className="no-print text-xs text-slate-500 mb-2">
                Área física considerada pela impressora: {modoPapel === 'bandeja148' ? '190 × 148 mm' : modoPapel === 'a4' ? 'A4 (210 × 297 mm)' : '190 × 97 mm'}
              </div>

              {/* Contêiner da Página de Impressão */}
              <div 
                className="print-area relative bg-white border border-dashed border-slate-400 shadow-lg"
                style={{
                  width: modoPapel === 'a4' ? '210mm' : '190mm',
                  height: modoPapel === 'a4' ? '297mm' : modoPapel === 'bandeja148' ? '148mm' : '97mm',
                  minWidth: modoPapel === 'a4' ? '210mm' : '190mm',
                  minHeight: modoPapel === 'a4' ? '297mm' : modoPapel === 'bandeja148' ? '148mm' : '97mm',
                }}
              >
                {/* Folha Amarela Física posicionada no topo com o offset */}
                <div 
                  className={`absolute transition-all ${mostrarGuia ? 'bg-[#ffe93b] guia-fundo border border-yellow-400' : 'bg-transparent'}`}
                  style={{
                    left: `${offset.x}mm`,
                    top: `${offset.y}mm`,
                    width: '190mm',
                    height: '97mm',
                  }}
                >
                  {mostrarGuia && (
                    <div className="no-print absolute inset-0 pointer-events-none opacity-20 p-3 text-[9px] font-mono">
                      <div className="border border-black h-full w-full rounded p-2 flex flex-col justify-between">
                        <div className="flex justify-between">
                          <span>NOTIFICAÇÃO DA RECEITA (A)</span>
                          <span className="w-24 text-center border-l border-black pl-2">ESPECIALIDADE</span>
                        </div>
                        <div className="text-center font-bold">ESPAÇO ASSINATURA</div>
                      </div>
                    </div>
                  )}

                  {/* Textos posicionados milimetricamente */}
                  <div 
                    className="absolute font-sans font-semibold text-slate-900 text-[13px] leading-tight"
                    style={{ left: `${coords.dia.x}mm`, top: `${coords.dia.y}mm` }}
                  >
                    {dados.dia}
                  </div>

                  <div 
                    className="absolute font-sans font-semibold text-slate-900 text-[13px] leading-tight"
                    style={{ left: `${coords.mes.x}mm`, top: `${coords.mes.y}mm` }}
                  >
                    {dados.mes}
                  </div>

                  <div 
                    className="absolute font-sans font-semibold text-slate-900 text-[13px] leading-tight"
                    style={{ left: `${coords.ano.x}mm`, top: `${coords.ano.y}mm` }}
                  >
                    {dados.ano}
                  </div>

                  <div 
                    className="absolute font-sans font-bold text-slate-900 text-[13px] leading-tight max-w-[55mm] truncate"
                    style={{ left: `${coords.paciente.x}mm`, top: `${coords.paciente.y}mm` }}
                  >
                    {dados.paciente}
                  </div>

                  <div 
                    className="absolute font-sans font-medium text-slate-900 text-[11px] leading-tight max-w-[55mm] truncate"
                    style={{ left: `${coords.endereco.x}mm`, top: `${coords.endereco.y}mm` }}
                  >
                    {dados.endereco}
                  </div>

                  <div 
                    className="absolute font-sans font-bold text-slate-900 text-[13px] leading-tight max-w-[45mm]"
                    style={{ left: `${coords.medicamento.x}mm`, top: `${coords.medicamento.y}mm` }}
                  >
                    {dados.medicamento}
                  </div>

                  <div 
                    className="absolute font-sans font-medium text-slate-900 text-[12px] leading-tight max-w-[45mm]"
                    style={{ left: `${coords.quantidade.x}mm`, top: `${coords.quantidade.y}mm` }}
                  >
                    {dados.quantidade}
                  </div>

                  <div 
                    className="absolute font-sans font-medium text-slate-900 text-[11px] leading-tight max-w-[48mm]"
                    style={{ left: `${coords.posologia.x}mm`, top: `${coords.posologia.y}mm` }}
                  >
                    {dados.posologia}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
